# ---DNAA2C specific parameters ---
action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"
buffer_size: 10
batch_size_run: 10
batch_size: 10

common_reward: False
entropy_coef: 0.01   # MPE
hidden_dim: 128
hypergroup: hp_grp_12
lr: 0.001
q_nstep: 10 # 1 corresponds to normal r + gammaV
q_target_consensus: True
max_edges: -1  # relative number of edges
n_consensus_steps: 1 # Number of consensus steps
use_rnn: False
standardise_rewards: True
# update the target network every {} training steps
target_update_interval_or_tau: 0.01 # MPE


obs_last_action: False
obs_agent_id: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "cnn_ns"
agent_output_type: "pi_logits"
learner: "actor_critic_networked_learner"
standardise_returns: False
critic_type: "ac_critic_ns" # All weights begin at the same place.

# Networked agents
q_target_consensus: True
max_edges: -1 # relative number of edges
n_consensus_steps: 30 # Number of consensus steps

name: "dnaa2c"
t_max: 2_888_000 
