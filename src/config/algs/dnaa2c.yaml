# ---DNAA2C specific parameters ---
action_selector: "soft_policies"
mask_before_softmax: True

runner: "parallel"
buffer_size: 10
batch_size_run: 10
batch_size: 10

hidden_dim: 128 # MPE
lr: 0.0005 # MPE
use_rnn: False  # MPE
standardise_rewards: True   # MPE
entropy_coef: 0.01   # MPE
# update the target network every {} training steps
target_update_interval_or_tau: 0.01 # MPE
q_nstep: 10 # 1 corresponds to normal r + gammaV
common_reward: False


obs_last_action: False
obs_agent_id: False
obs_individual_obs: False

mac: "non_shared_mac"
agent: "cnn_ns"
agent_output_type: "pi_logits"
learner: "actor_critic_networked_learner"
standardise_returns: False
critic_type: "bigv_critic_ns" # All weights begin at the same place.

# Networked agents
q_target_consensus: True
max_edges: 0.5  # relative number of edges
n_consensus_steps: 5 # Number of consensus steps

name: "dnaa2c"
t_max: 2_888_000 
