# --- IQL NS specific parameters ---

# use epsilon greedy action selector
action_selector: "epsilon_greedy"
epsilon_start: 1.0
epsilon_finish: 0.05
epsilon_anneal_time: 230_400
evaluation_epsilon: 0.0
lr: 0.001

runner: "episode"

buffer_size: 5000
batch_size: 32
# buffer_size: 50

# update the target network every {} episodes
# target_update_interval_or_tau: 10
target_update_interval_or_tau: 0.01

# Consensus parameters
target_consensus: False
q_temporal_difference: True
max_distance: 4
filter_agents: [0, 1, 2]

obs_agent_id: False
obs_last_action: False
obs_individual_obs: False

common_reward: False

# use the Q_Learner to train
mac: "non_shared_mac"
agent: "cnn_ns"
agent_output_type: "q"
learner: "q_learner"
standardise_returns: False
standardise_rewards: True
double_q: True
use_rnn: False
mixer: # Mixer becomes None

name: "dvdn_ns"
t_max: 288_000 
